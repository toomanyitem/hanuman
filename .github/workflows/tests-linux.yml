name: Linux Tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/v*']
  pull_request:
    branches: [main, 'release/v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests (Linux)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run Unit Tests
        uses: ./.github/actions/tests/run-unit-tests

  cli-test:
    name: CLI Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run CLI Tests
        uses: ./.github/actions/tests/run-cli-tests

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: CLI Test Results (Linux)
          files: |
            packages/bruno-tests/collection/junit.xml
            packages/bruno-tests/safe-mode/junit.xml
          comment_mode: always
          check_run: false

  cli-test-cache-modules:
    name: CLI Tests with experimental-cache-modules (Linux)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run CLI Tests
        uses: ./.github/actions/tests/run-cli-tests
        with:
          experimental_cache_modules: 'true'

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: CLI Test Results with experimental-cache-modules (Linux)
          files: |
            packages/bruno-tests/collection/junit.xml
            packages/bruno-tests/safe-mode/junit.xml
          comment_mode: always
          check_run: false

  e2e-test:
    name: Playwright E2E Tests (Linux) ${{ matrix.shard }}/${{ matrix.shardTotal }}
    timeout-minutes: 240
    # Hanuman: e2e is heavy on private-repo Actions minutes, run it on demand only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shardTotal: [4]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y \
            libglib2.0-0 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 \
            xvfb \
            gsettings-desktop-schemas dbus-x11

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Configure Chrome Sandbox
        run: |
          CHROME_SANDBOX="${GITHUB_WORKSPACE}/node_modules/electron/dist/chrome-sandbox"
          if [[ -f "$CHROME_SANDBOX" ]]; then
            sudo chown root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
          fi

      - name: Run E2E Tests
        uses: ./.github/actions/tests/run-e2e-tests
        with:
          os: ubuntu
          shard: ${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-linux-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-test-report:
    name: Merge Playwright Reports (Linux)
    if: ${{ !cancelled() && needs.e2e-test.result != 'skipped' }}
    needs: [e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-linux-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-linux
          path: playwright-report/
          retention-days: 30

  git-panel-e2e:
    name: Git Panel E2E Tests (Linux)
    # Hanuman: the full e2e suite is workflow_dispatch only, but the Git panel and data-driven specs run on every PR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y \
            libglib2.0-0 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 \
            xvfb \
            gsettings-desktop-schemas dbus-x11

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Configure Chrome Sandbox
        run: |
          CHROME_SANDBOX="${GITHUB_WORKSPACE}/node_modules/electron/dist/chrome-sandbox"
          if [[ -f "$CHROME_SANDBOX" ]]; then
            sudo chown root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
          fi

      - name: Install Test Collection Dependencies
        run: npm ci --prefix packages/bruno-tests/collection

      - name: Run Git Panel E2E Tests
        run: xvfb-run dbus-run-session -- npx playwright test tests/git-panel --project=default --workers=1

      - name: Run Data-driven E2E Tests
        run: xvfb-run dbus-run-session -- npx playwright test tests/data-driven --project=default --workers=1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: playwright-report-git-panel
          path: playwright-report
          retention-days: 7

  ssl-test:
    name: SSL Tests (Linux)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Setup Feature Dependencies
        uses: ./.github/actions/ssl/linux/setup-feature-specific-deps

      - name: Setup CA Certificates
        uses: ./.github/actions/ssl/linux/setup-ca-certs

      - name: Setup Client Certificates
        uses: ./.github/actions/ssl/linux/setup-client-certs

      - name: Run Basic SSL CLI Tests
        uses: ./.github/actions/ssl/linux/run-basic-ssl-cli-tests

      - name: Run Custom CA Certs CLI Tests
        uses: ./.github/actions/ssl/linux/run-custom-ca-certs-cli-tests

      - name: Run Client Certs CLI Tests
        uses: ./.github/actions/ssl/linux/run-client-certs-cli-tests

      - name: Run Custom CA Certs E2E Tests
        uses: ./.github/actions/ssl/linux/run-ssl-e2e-tests

  oauth1-tests:
    name: OAuth 1.0 Auth Tests (Linux)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Setup Feature Dependencies
        uses: ./.github/actions/auth/oauth1/linux/setup-feature-specific-deps

      - name: Run Auth E2E Tests
        uses: ./.github/actions/auth/oauth1/linux/run-auth-e2e-tests

      - name: Start Test Server
        uses: ./.github/actions/auth/oauth1/linux/start-test-server

      - name: Run OAuth1 CLI Tests
        uses: ./.github/actions/auth/oauth1/linux/run-oauth1-cli-tests