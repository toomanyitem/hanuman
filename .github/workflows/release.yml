name: Release

# Builds every platform Bruno ships — desktop apps for macOS, Windows and Linux
# (x64 + arm64), a snap, the CLI tarball and multi-arch CLI Docker images — and
# attaches them to a GitHub Release. Nothing is signed with an Apple Developer ID or
# a Windows certificate; macOS apps carry the repository's self-signed certificate
# (see readme.md).
#
# Manual: run it from the Actions tab with an existing tag. The release is
# created (or updated) in this repository, where the app checks for updates.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true
      platforms:
        description: 'What to build. Anything short of "all" skips the snap, the CLI and its Docker images'
        type: choice
        default: all
        options:
          - all
          - macOS + Windows
          - Windows

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}
  # SHA-1 of the self-signed certificate every macOS release is signed with
  # (scripts/hanuman/sign-mac-app.sh). Installed apps only update to builds signed with it.
  HANUMAN_MAC_CERT_SHA1: 8C314EF8D2A8FA040E310FE6CBF7D19B6796B13D

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      # Targets and arches come from packages/bruno-electron/electron-builder-config.js,
      # except macOS: building both arches in one run races on the pkg target's shared
      # temp files (out/<appId>.pkg), so each arch gets its own job. macOS is only
      # packed here; sign-macos and package-macos turn it into installers.
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          targets='[
            {"name":"macOS Intel","os":"macos-latest","builder-args":"--mac dir --x64","mac-arch":"x64"},
            {"name":"macOS Apple Silicon","os":"macos-latest","builder-args":"--mac dir --arm64","mac-arch":"arm64"},
            {"name":"Windows","os":"windows-latest","builder-args":"--win"},
            {"name":"Linux","os":"ubuntu-latest","builder-args":"--linux"}
          ]'
          case "$PLATFORMS" in
            'macOS + Windows') targets=$(echo "$targets" | jq -c 'map(select(.name != "Linux"))') ;;
            Windows) targets=$(echo "$targets" | jq -c 'map(select(.name == "Windows"))') ;;
          esac
          echo "matrix=$(echo "$targets" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "macos=$(echo "$targets" | jq 'any(.[]; has("mac-arch"))')" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      # npm only installs node-pty's prebuilt binary for the runner's own arch;
      # cross-arch builds need both. Keep in sync with forceInstallPlatformDeps()
      # in scripts/setup.js.
      - name: Install node-pty for every arch
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   platform=darwin ;;
            Windows) platform=win32 ;;
            Linux)   platform=linux ;;
          esac
          npm i --legacy-peer-deps --no-save --force \
            "@lydell/node-pty-${platform}-arm64@1.1.0" "@lydell/node-pty-${platform}-x64@1.1.0"

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set version from tag
        shell: bash
        run: node scripts/hanuman/set-version.js "${RELEASE_TAG}"

      - name: Build web app
        shell: bash
        run: npm run build:web

      - name: Build desktop app
        shell: bash
        env:
          ELECTRON_BUILDER_ARGS: ${{ matrix.builder-args }} --publish never
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/build-electron.js

      # The packed app goes to sign-macos as a tarball: upload-artifact drops the
      # symlinks inside Electron's frameworks.
      - name: Archive macOS app
        if: matrix.mac-arch
        shell: bash
        working-directory: packages/bruno-electron/out
        run: tar -czf "$RUNNER_TEMP/macos-app-unsigned-${{ matrix.mac-arch }}.tgz" mac*/Hanuman.app

      - name: Upload macOS app
        if: matrix.mac-arch
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned-${{ matrix.mac-arch }}
          path: ${{ runner.temp }}/macos-app-unsigned-${{ matrix.mac-arch }}.tgz
          if-no-files-found: error

      - name: Upload installers
        if: ${{ !matrix.mac-arch }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.pkg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
            packages/bruno-electron/out/*.rpm

  # Signs the packed macOS app on a fresh runner that installs no npm packages,
  # so no dependency or build script ever runs where the signing key is available.
  sign-macos:
    name: Sign macOS ${{ matrix.mac-arch }}
    needs: [plan, build-desktop]
    if: ${{ !cancelled() && needs.plan.outputs.macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mac-arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: scripts/hanuman

      - uses: actions/download-artifact@v4
        with:
          name: macos-app-unsigned-${{ matrix.mac-arch }}
          path: ${{ runner.temp }}

      - name: Sign
        shell: bash
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          ARCH: ${{ matrix.mac-arch }}
        run: |
          if [ -z "$MAC_SIGNING_P12_BASE64" ] || [ -z "$MAC_SIGNING_P12_PASSWORD" ]; then
            echo "::error::Set the MAC_SIGNING_P12_BASE64 and MAC_SIGNING_P12_PASSWORD secrets (see readme.md)"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/macos-app-unsigned-$ARCH.tgz" -C "$RUNNER_TEMP/app"
          scripts/hanuman/sign-mac-app.sh "$RUNNER_TEMP"/app/mac*/Hanuman.app
          cd "$RUNNER_TEMP/app" && tar -czf "$RUNNER_TEMP/macos-app-signed-$ARCH.tgz" mac*/Hanuman.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-signed-${{ matrix.mac-arch }}
          path: ${{ runner.temp }}/macos-app-signed-${{ matrix.mac-arch }}.tgz
          if-no-files-found: error

  package-macos:
    name: Build macOS ${{ matrix.mac-arch }} installers
    needs: [plan, sign-macos]
    if: ${{ !cancelled() && needs.plan.outputs.macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'macOS Intel', mac-arch: x64 }
          - { name: 'macOS Apple Silicon', mac-arch: arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      # Installer file names take the version from package.json.
      - name: Set version from tag
        shell: bash
        run: node scripts/hanuman/set-version.js "${RELEASE_TAG}"

      - uses: actions/download-artifact@v4
        with:
          name: macos-app-signed-${{ matrix.mac-arch }}
          path: ${{ runner.temp }}

      - name: Build installers
        shell: bash
        env:
          ARCH: ${{ matrix.mac-arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p packages/bruno-electron/out
          tar -xzf "$RUNNER_TEMP/macos-app-signed-$ARCH.tgz" -C packages/bruno-electron/out
          app=$(echo "$PWD"/packages/bruno-electron/out/mac*/Hanuman.app)
          npm exec --workspace=packages/bruno-electron -- electron-builder --mac pkg dmg zip "--$ARCH" \
            --prepackaged "$app" --config electron-builder-config.js --publish never

      # Fails if packaging re-signed the app instead of keeping the release certificate.
      - name: Check the installers' signature
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/check"
          ditto -x -k packages/bruno-electron/out/*_mac.zip "$RUNNER_TEMP/check"
          codesign --verify --deep --strict "$RUNNER_TEMP/check/Hanuman.app"
          expected=$(echo "$HANUMAN_MAC_CERT_SHA1" | tr 'A-F' 'a-f')
          codesign -d -r- "$RUNNER_TEMP/check/Hanuman.app" 2>/dev/null | grep -F "certificate leaf = H\"$expected\""

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.pkg
            packages/bruno-electron/out/*.zip

  build-snap:
    name: Build Snap
    # electron-builder 24 only emits core20/core22 snaps, so build on 22.04.
    if: ${{ inputs.platforms == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # A snap problem should not hold back the other installers.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Set version from tag
        run: node scripts/hanuman/set-version.js "${RELEASE_TAG}"

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        # Destructive mode installs build packages on the host, which needs root.
        run: sudo -E env "PATH=$PATH" ./scripts/build-snap-local.sh

      - name: Name the snap after Hanuman
        run: |
          cd packages/bruno-electron/out
          for f in *.snap; do sudo mv "$f" "hanuman_${f#*_}" 2>/dev/null || true; done
          ls -la *.snap

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Snap
          if-no-files-found: error
          path: packages/bruno-electron/out/*.snap

  build-cli:
    name: Build CLI bundle and Docker images
    if: ${{ inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Set version from tag
        run: node scripts/hanuman/set-version.js "${RELEASE_TAG}"

      - name: Bundle CLI
        run: |
          node scripts/bundle-cli.js
          mkdir -p cli-release
          cp dist/cli-bundle/*.tgz "cli-release/hanuman-cli_${RELEASE_TAG#v}.tgz"
          cp dist/cli-bundle/*.tgz docker/cli/hanuman-cli.tgz

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli
          if-no-files-found: error
          path: cli-release/*.tgz

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hanuman-cli" >> "$GITHUB_OUTPUT"

      - name: Build and push alpine image
        uses: docker/build-push-action@v6
        with:
          context: docker/cli
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=node:22-alpine
            HANUMAN_VERSION=${{ env.RELEASE_TAG }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}-alpine
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:alpine

      - name: Build and push debian image
        uses: docker/build-push-action@v6
        with:
          context: docker/cli
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=node:22-slim
            HANUMAN_VERSION=${{ env.RELEASE_TAG }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}-debian
            ${{ steps.image.outputs.name }}:debian

  release:
    name: Publish GitHub Release
    needs: [build-desktop, package-macos, build-snap, build-cli]
    if: ${{ !cancelled() && needs.build-desktop.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.package-macos.result) && contains(fromJSON('["success", "skipped"]'), needs.build-cli.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -f release-files/macos-app-*.tgz
          ls -la release-files
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --title "Hanuman $RELEASE_TAG" \
              --notes "Built from tag $RELEASE_TAG of ${{ github.repository }}. The builds are not signed with an Apple Developer ID (see the readme)."
          fi
